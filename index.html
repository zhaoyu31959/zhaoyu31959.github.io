<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ra1ny</title>
<style>
  :root {
    --ink: #12100e;
    --paper: #f2ede3;
    --a: #e4572e;
    --b: #2d5d7b;
    --c: #e4c04a;
    --d: #8c3b4a;

    --gap: 1.6vh;
    --word: min(14.5vw, 10.5vh);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--ink);
    display: grid;
    place-items: center;
    overflow: hidden;
    font-family: "Helvetica Neue", Arial, "PingFang SC", sans-serif;
  }

  .poster {
    position: relative;
    width: min(94vw, 62vh);
    aspect-ratio: 2 / 3;
    background: var(--ink);
    overflow: hidden;
    display: grid;
    place-items: center;
  }

  .blocks {
    position: absolute;
    inset: 0;
    padding: var(--gap);
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: var(--gap);
    z-index: 1;
  }

  .blocks span {
    display: block;
    background: var(--paper);
  }

  .word {
    position: relative;
    z-index: 2;
    padding: 0.28em 0.36em;
    background: var(--ink);
    font-size: var(--word);
    font-weight: 900;
    letter-spacing: -0.02em;
    line-height: 1;
    color: var(--a);
    pointer-events: none;
    white-space: nowrap;
    perspective: 800px;
  }

  .word__turn {
    display: inline-block;
    transform: rotate3d(0, 1, 0, var(--turn, 0deg));
    transform-origin: 50% 50%;
    transition: transform 0.8s cubic-bezier(0.165, 0.84, 0.44, 1);
    will-change: transform;
  }

  .side-link {
    position: fixed;
    top: 50%;
    z-index: 3;
    color: var(--a);
    font-size: clamp(1.5rem, 4.5vw, 4.5rem);
    font-weight: 900;
    letter-spacing: -0.04em;
    line-height: 1;
    text-decoration: none;
    text-transform: uppercase;
    white-space: nowrap;
    text-shadow:
      0 0 0.08em var(--ink),
      0 0 0.35em var(--ink);
    opacity: 0;
    pointer-events: none;
    transition:
      opacity 0.35s ease,
      transform 0.35s cubic-bezier(0.165, 0.84, 0.44, 1),
      color 0.2s ease;
  }

  .side-link--github {
    left: clamp(1.25rem, 3vw, 3rem);
    transform: translate(-0.75rem, -50%);
  }

  .side-link--linuxdo {
    right: clamp(1.25rem, 3vw, 3rem);
    transform: translate(0.75rem, -50%);
  }

  body.show-left .side-link--github,
  body.show-right .side-link--linuxdo {
    opacity: 1;
    pointer-events: auto;
    transform: translate(0, -50%);
  }

  .side-link:hover,
  .side-link:focus-visible {
    color: var(--c);
  }

  .side-link:focus-visible {
    opacity: 1;
    pointer-events: auto;
    outline: 2px solid var(--c);
    outline-offset: 0.15em;
    transform: translate(0, -50%);
  }

  @media (prefers-reduced-motion: reduce) {
    .word__turn { transition: none; }
    .side-link { transition: none; }
  }

  @media (max-aspect-ratio: 1/1) {
    :root { --word: min(12vw, 8vh); }
  }
</style>
</head>
<body>
  <main class="poster">
    <div class="blocks">
      <span class="b1"></span><span class="b2"></span><span class="b3"></span>
      <span class="b4"></span><span class="b5"></span><span class="b6"></span>
      <span class="b7"></span><span class="b8"></span><span class="b9"></span>
    </div>

    <div class="word"><span class="word__turn">ra1ny</span></div>
  </main>

  <a class="side-link side-link--github" href="https://github.com/zhaoyu31959" target="_blank" rel="noopener noreferrer">GitHub</a>
  <a class="side-link side-link--linuxdo" href="https://linux.do/u/rainey31959/summary" target="_blank" rel="noopener noreferrer">Linux DO</a>

  <script>
    const word = document.querySelector(".word");
    const maxTurn = 45;
    const sideThreshold = 2;
    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    let frame = 0;
    let pointerX = 0;

    const updateTurn = () => {
      frame = 0;
      const half = window.innerWidth / 2;
      const turn = Math.max(-maxTurn, Math.min(maxTurn, (pointerX / half - 1) * maxTurn));
      if (!reducedMotion) word.style.setProperty("--turn", `${turn.toFixed(2)}deg`);
      document.body.classList.toggle("show-left", turn < -sideThreshold);
      document.body.classList.toggle("show-right", turn > sideThreshold);
    };

    const resetTurn = () => {
      if (frame) cancelAnimationFrame(frame);
      frame = 0;
      word.style.setProperty("--turn", "0deg");
      document.body.classList.remove("show-left", "show-right");
    };

    const onPointerMove = (event) => {
      if (event.pointerType === "touch") return;
      pointerX = event.clientX;
      if (!frame) frame = requestAnimationFrame(updateTurn);
    };

    window.addEventListener("pointermove", onPointerMove);
    document.documentElement.addEventListener("mouseleave", resetTurn);
    window.addEventListener("blur", resetTurn);
  </script>
</body>
</html>
